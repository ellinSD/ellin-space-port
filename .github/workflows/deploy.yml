name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build portfolio
        run: npm run build

      - name: Prepare GitHub Pages files
        run: |
          rm -rf pages
          mkdir -p pages

          if [ -f "dist/index.html" ]; then
            cp -r dist/. pages/
          elif [ -f "dist/_shell.html" ]; then
            cp -r dist/. pages/
            cp dist/_shell.html pages/index.html
          elif [ -f "dist/client/index.html" ]; then
            cp -r dist/client/. pages/
          elif [ -f "dist/client/_shell.html" ]; then
            cp -r dist/client/. pages/
            cp dist/client/_shell.html pages/index.html
          else
            echo "ERROR: No index.html or _shell.html found"
            echo "Contents of dist:"
            find dist -maxdepth 3 -type f | sort
            exit 1
          fi

          cp pages/index.html pages/404.html

          echo "Final Pages files:"
          find pages -maxdepth 2 -type f | sort

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
